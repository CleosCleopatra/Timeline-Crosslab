<!DOCTYPE html>
<html>
<head>

<title>Project Timeline</title>

<script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

<link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet">

<style>

body {
    font-family: Arial, sans-serif;
    margin:40px;
    background:#f7f7f7;
}

h1 {
    text-align:center;
}

#timeline {
    background:white;
    height:700px;
    border-radius:12px;
}

</style>

</head>

<body>

<h1>Project Timeline</h1>

<div id="timeline"></div>

<script>

const sheetURL = "PASTE-YOUR-WORKING-CSV-URL-HERE";

async function testSheet() {

    const response = await fetch(sheetURL);
    const data = await response.text();

    console.log("========== RAW CSV ==========");
    console.log(data);

    const rows = data
        .trim()
        .split("\n")
        .map(row => row.split(","));

    console.log("========== ROWS ==========");
    console.log(rows);

    console.log("Number of rows:", rows.length);

    rows.forEach((row, index) => {
        console.log(
            "ROW", index,
            "| Title:", row[0],
            "| Year:", row[1],
            "| Month:", row[2],
            "| Day:", row[3],
            "| Description:", row[4],
            "| Category:", row[5],
            "| Color:", row[6]
        );
    });

}

testSheet();

</script>

</body>
</html>
