<!DOCTYPE html>
<html>
<head>

<title>Project Timeline</title>

<script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

<link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet">

<style>

body {
    font-family: Arial, sans-serif;
    margin:40px;
    background:#f7f7f7;
}

h1 {
    text-align:center;
}

#timeline {
    background:white;
    height:700px;
    border-radius:12px;
}

</style>

</head>

<body>

<h1>Project Timeline</h1>

<div id="timeline"></div>


<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/e/1k2s9GIOZHw3cGzi3nKKOZBFurP6QITysJpS3u3SECEY/pub?output=csv";

fetch(sheetURL)
    .then(response => {
        console.log("Response status:", response.status);
        console.log("Response OK:", response.ok);
        return response.text();
    })
    .then(data => {
        console.log("GOOGLE SHEET DATA:");
        console.log(data);

        document.getElementById("timeline").innerHTML =
            "<pre>" + data.replace(/</g, "&lt;") + "</pre>";
    })
    .catch(error => {
        console.error("GOOGLE SHEET ERROR:", error);

        document.getElementById("timeline").innerHTML =
            "<h2>Could not load Google Sheet</h2><pre>" +
            error +
            "</pre>";
    });

</script>


</body>
</html>
