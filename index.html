<!DOCTYPE html>
<html>
<head>

<title>Project Timeline</title>

<script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

<link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet">

<style>

body {
    font-family: Arial, sans-serif;
    margin:40px;
    background:#f7f7f7;
}

h1 {
    text-align:center;
}

#timeline {
    background:white;
    height:700px;
    border-radius:12px;
}

</style>

</head>

<body>

<h1>Project Timeline</h1>

<div id="timeline"></div>

<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvXDqC7r3Xma30LXAERkqBDHTx12DsjSl5Un-11UR3aVGgo_6KCDKsM-qP3K0NVE4ZFDdoTz5jhh63/pub?gid=0&single=true&output=csv";


fetch(sheetURL)
    .then(response => response.text())
    .then(data => {

        alert("Received " + data.length + " characters");

        console.log("RAW DATA:");
        console.log(data);

        document.body.innerHTML =
            "<pre style='white-space: pre-wrap;'>" +
            data.replace(/</g, "&lt;") +
            "</pre>";

    })
    .catch(error => {

        alert("ERROR: " + error);

        console.error(error);

    });

</script>

</body>
</html>
